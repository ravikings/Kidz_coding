name: Deploy to GitHub Pages

# Publishes kidz_coding/index.html to GitHub Pages on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages (with GitHub Actions as source) on first run.
          enablement: true

      # Publish only the app folder so index.html sits at the site root.
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: kidz_coding

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
